<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MicrocreditosBX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .imagen-banner {
            position: relative;
            display: inline-block;
        }
        .imagen-banner img {
            width: 150px;
            border-radius: 20px;
        }
        .imagen-banner::after {
            content: "⚡ Microcréditos rápidos ⚡";
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="text-center">
        <h1 class="text-primary">MicrocreditosBX</h1>
    </div>
    
    <div class="text-center mt-2 mb-4">
        <div class="imagen-banner">
            <img src="img/microcreditos.webp" alt="Logo">
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
        <button onclick="mostrar('registro')" class="btn btn-outline-primary">Registrar</button>
        <button onclick="mostrar('solicitar')" class="btn btn-outline-success">Solicitar</button>
        <button onclick="mostrar('estado')" class="btn btn-outline-info">Estado</button>
        <button onclick="mostrar('pagar')" class="btn btn-outline-warning">Pagar</button>
    </div>

    <div id="registro" class="seccion activo">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-primary">Registro de Usuario</h2>
                <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre completo">
                <input type="text" id="cedula" class="form-control mb-2" placeholder="Cédula">
                <input type="email" id="correo" class="form-control mb-2" placeholder="Correo electrónico">
                <input type="text" id="telefono" class="form-control mb-2" placeholder="Teléfono">
                <button onclick="registrar()" class="btn btn-primary w-100">Registrarse</button>
                <div id="msgRegistro" class="mensaje mt-3"></div>
            </div>
        </div>
    </div>

    <div id="solicitar" class="seccion">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-success">Solicitar Crédito</h2>
                <input type="email" id="solCorreo" class="form-control mb-2" placeholder="Tu correo">
                <input type="number" id="monto" class="form-control mb-2" placeholder="Monto deseado">
                <button onclick="solicitar()" class="btn btn-success w-100">Enviar Solicitud</button>
                <div id="msgSolicitud" class="mensaje mt-3"></div>
            </div>
        </div>
    </div>

    <div id="estado" class="seccion">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-info">Mis Solicitudes</h2>
                <input type="email" id="estCorreo" class="form-control mb-2" placeholder="Tu correo">
                <button onclick="verSolicitudes()" class="btn btn-info w-100 text-white">Consultar</button>
                <div id="listaSolicitudes" class="mensaje mt-3"></div>
                <hr>
                <h2 class="card-title text-info">Mi Crédito</h2>
                <button onclick="verCredito()" class="btn btn-info w-100 text-white">Ver crédito activo</button>
                <div id="infoCredito" class="mensaje mt-3"></div>
            </div>
        </div>
    </div>

    <div id="pagar" class="seccion">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-warning">Realizar Pago</h2>
                <input type="email" id="pagCorreo" class="form-control mb-2" placeholder="Tu correo">
                <input type="number" id="pagMonto" class="form-control mb-2" placeholder="Monto a pagar">
                <select id="metodo" class="form-select mb-2">
                    <option value="PSE">PSE</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Daviplata">Daviplata</option>
                </select>
                <button onclick="pagar()" class="btn btn-warning w-100">Pagar</button>
                <div id="msgPago" class="mensaje mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://127.0.0.1:8080";

    function mostrar(id) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activo'));
        document.getElementById(id).classList.add('activo');
    }

    function mostrarMsg(elemento, texto, tipo) {
        elemento.innerHTML = `<div class="alert alert-${tipo === 'exito' ? 'success' : 'danger'}">${texto}</div>`;
        setTimeout(() => { elemento.innerHTML = ''; }, 5000);
    }

    async function registrar() {
        const nombre = document.getElementById('nombre').value;
        const cedula = document.getElementById('cedula').value;
        const correo = document.getElementById('correo').value;
        const telefono = document.getElementById('telefono').value;
        const msg = document.getElementById('msgRegistro');

        if (!nombre || !cedula || !correo) {
            mostrarMsg(msg, "Complete nombre, cédula y correo", "error");
            return;
        }

        const btn = event.target;
        const textoOriginal = btn.innerHTML;
        btn.innerHTML = "Registrando...";
        btn.disabled = true;

        try {
            const res = await fetch(`${API}/registrar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, cedula, correo, telefono })
            });
            const data = await res.json();
            if (res.ok) {
                mostrarMsg(msg, "Usuario registrado correctamente", "exito");
                document.getElementById('nombre').value = '';
                document.getElementById('cedula').value = '';
                document.getElementById('correo').value = '';
                document.getElementById('telefono').value = '';
            } else {
                mostrarMsg(msg, "Error: " + data.detail, "error");
            }
        } catch (err) {
            mostrarMsg(msg, "Error de conexión", "error");
        } finally {
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    }

    async function solicitar() {
        const correo = document.getElementById('solCorreo').value;
        const monto = document.getElementById('monto').value;
        const msg = document.getElementById('msgSolicitud');

        if (!correo || !monto) {
            mostrarMsg(msg, "Complete todos los campos", "error");
            return;
        }

        const btn = event.target;
        const textoOriginal = btn.innerHTML;
        btn.innerHTML = "Enviando...";
        btn.disabled = true;

        try {
            const res = await fetch(`${API}/solicitar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ correo, monto: parseFloat(monto) })
            });
            const data = await res.json();
            if (res.ok) {
                mostrarMsg(msg, "Solicitud creada - Estado: " + data.estado, "exito");
                document.getElementById('monto').value = '';
            } else {
                mostrarMsg(msg, "Error: " + data.detail, "error");
            }
        } catch (err) {
            mostrarMsg(msg, "Error de conexión", "error");
        } finally {
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    }

    async function verSolicitudes() {
        const correo = document.getElementById('estCorreo').value;
        const div = document.getElementById('listaSolicitudes');

        if (!correo) {
            div.innerHTML = '<div class="alert alert-danger">Ingrese su correo</div>';
            return;
        }

        try {
            const res = await fetch(`${API}/solicitudes/${correo}`);
            const data = await res.json();
            if (res.ok && data.solicitudes.length > 0) {
                let html = '<div class="alert alert-success">';
                data.solicitudes.forEach(s => {
                    html += `<p>Monto: $${s.monto} | Estado: ${s.estado} | Fecha: ${new Date(s.fecha).toLocaleDateString()}</p>`;
                });
                html += '</div>';
                div.innerHTML = html;
            } else {
                div.innerHTML = '<div class="alert alert-warning">No tiene solicitudes</div>';
            }
        } catch (err) {
            div.innerHTML = '<div class="alert alert-danger">Error de conexión</div>';
        }
    }

    async function verCredito() {
        const correo = document.getElementById('estCorreo').value;
        const div = document.getElementById('infoCredito');

        if (!correo) {
            div.innerHTML = '<div class="alert alert-danger">Ingrese su correo</div>';
            return;
        }

        try {
            const res = await fetch(`${API}/credito/${correo}`);
            const data = await res.json();
            if (res.ok && data.monto_aprobado) {
                div.innerHTML = `<div class="alert alert-success">
                    Monto aprobado: $${data.monto_aprobado}<br>
                    Saldo pendiente: $${data.saldo_pendiente}<br>
                    Cuotas pagadas: ${data.cuotas_pagadas}/${data.cuotas_totales}
                </div>`;
            } else {
                div.innerHTML = '<div class="alert alert-warning">No tiene créditos activos</div>';
            }
        } catch (err) {
            div.innerHTML = '<div class="alert alert-danger">Error de conexión</div>';
        }
    }

    async function pagar() {
        const correo = document.getElementById('pagCorreo').value;
        const monto = document.getElementById('pagMonto').value;
        const msg = document.getElementById('msgPago');

        if (!correo || !monto) {
            mostrarMsg(msg, "Complete todos los campos", "error");
            return;
        }

        const btn = event.target;
        const textoOriginal = btn.innerHTML;
        btn.innerHTML = "Procesando pago...";
        btn.disabled = true;

        try {
            const res = await fetch(`${API}/pagar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ correo, monto: parseFloat(monto) })
            });
            const data = await res.json();
            if (res.ok) {
                mostrarMsg(msg, data.mensaje + " - Saldo restante: $" + data.saldo_restante, "exito");
                document.getElementById('pagMonto').value = '';
            } else {
                mostrarMsg(msg, "Error: " + data.detail, "error");
            }
        } catch (err) {
            mostrarMsg(msg, "Error de conexión", "error");
        } finally {
            btn.innerHTML = textoOriginal;
            btn.disabled = false;
        }
    }

    mostrar('registro');
</script>

</body>
</html>
